<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tab icon. Sits on its own dark tile rather than a transparent ground:
       browser tab bars are light in some themes and dark in others, and an
       outlined mark disappears against one of them. -->
  <rect width="32" height="32" rx="7" fill="#14171c"/>
  <g fill="none" stroke-linecap="round" stroke-width="2.6">
    <path d="M16 13.4 C16 17.6, 8.6 16.2, 8.6 20.2" stroke="#8b8f98"/>
    <path d="M16 13.4 C16 17.6, 23.4 16.2, 23.4 20.2" stroke="#f2a623"/>
  </g>
  <rect x="11.9" y="5.4" width="8.2" height="8.2" rx="2.6" fill="#14171c" stroke="#e8e6df" stroke-width="2.6"/>
  <rect x="4.5" y="19.9" width="8.2" height="8.2" rx="2.6" fill="#14171c" stroke="#8b8f98" stroke-width="2.6"/>
  <rect x="19.3" y="19.9" width="8.2" height="8.2" rx="2.6" fill="#f2a623"/>
</svg>
