version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    groups:
      # One PR for the routine bumps; anything major still comes separately.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
